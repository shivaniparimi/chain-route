global:
  scrape_interval: 5s

scrape_configs:
  - job_name: chainroute-go-api
    static_configs:
      - targets: ["go-server:8080"]
        labels:
          service: go-api
  - job_name: chainroute-worker
    static_configs:
      - targets: ["go-worker:9091"]
        labels:
          service: worker
  - job_name: chainroute-router
    static_configs:
      - targets: ["cpp-router:9102"]
        labels:
          service: router
