<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChainRoute Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      env-config.js must load BEFORE the main bundle: it sets
      window.__CHAINROUTE_API_BASE_URL__, which src/api/client.ts reads
      synchronously on first call. Task 13's Docker entrypoint overwrites
      this file at container start with the deployment's real API URL;
      the committed version here is just the localhost dev default.
    -->
    <script src="/env-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
