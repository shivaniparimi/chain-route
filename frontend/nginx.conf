# Minimal server block overriding nginx:1.27-alpine's stock default.conf.
#
# The app is a client-side-routed SPA (React Router's BrowserRouter, see
# src/router.tsx / src/App.tsx), so nginx must serve index.html for any
# path that doesn't correspond to a literal file on disk (e.g. a hard
# refresh or direct link to /payments or /payments/:id) and let React
# Router take over from there. Without the try_files fallback below, the
# stock config's `location / { try_files $uri $uri/ =404; }` returns a
# bare 404 for those paths instead of the app shell.
#
# Everything else here just mirrors nginx:1.27-alpine's stock default.conf
# (root, index, and static asset serving) -- no functionality is removed,
# only the SPA fallback is added.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
